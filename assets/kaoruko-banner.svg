<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Kaoruko Waguri</title>
  <desc id="desc">Banner roxo decorativo para a Kaoruko Waguri</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140b2d"/>
      <stop offset="48%" stop-color="#3d1867"/>
      <stop offset="100%" stop-color="#120b29"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9adff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d6a6ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb">
      <stop offset="0%" stop-color="#efc9ff" stop-opacity=".8"/>
      <stop offset="45%" stop-color="#bd71eb" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#bd71eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="130" cy="78" r="190" fill="url(#orb)"/>
  <circle cx="1080" cy="300" r="240" fill="url(#orb)"/>
  <path d="M-40 282C185 197 281 355 484 278S816 190 1240 268" fill="none" stroke="#dca7ff" stroke-opacity=".20" stroke-width="2"/>
